name: Build SOL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --org com.sol --project-name store --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Download Arabic font for PDF invoices
        run: |
          mkdir -p assets/fonts
          for w in Regular Bold; do
            curl -fsSL -o assets/fonts/Amiri-$w.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-$w.ttf"
          done
          pip install fonttools >/dev/null
          python3 -c "
          from fontTools.ttLib import TTFont
          for w in ['Regular','Bold']:
              c = TTFont(f'assets/fonts/Amiri-{w}.ttf').getBestCmap()
              assert 0x0628 in c and 0xFE91 in c, 'missing arabic glyphs'
          print('fonts ok')"

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Sample invoice PDF
        run: flutter test tool/pdf_preview_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk SOL.apk

      - name: Build small APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk SOL-arm64.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SOL-apk
          path: '*.apk'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SOL ${{ github.run_number }}
          files: |
            SOL.apk
            SOL-arm64.apk
            SOL-invoice-sample.pdf
          make_latest: true
